# CloudWatch -> Logstash -> Elasticsearch
# Requires: bin/logstash-plugin install logstash-input-cloudwatch_logs
input {
  cloudwatch_logs {
    log_group => ["/aws/eks/my-cluster/cluster", "/aws/ec2/app"]
    region => "ap-south-1"
    interval => 60
    start_position => "end"
  }
}
filter {
  json { source => "message" skip_on_invalid_json => true }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "aws-cloudwatch-%{+YYYY.MM.dd}"
  }
}
