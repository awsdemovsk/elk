# Option B: autodiscover (Filebeat runs as a container, see docker-compose-filebeat.yml)
filebeat.autodiscover:
  providers:
    - type: docker
      hints.enabled: true
      templates:
        - condition:
            contains: {docker.container.image: nginx}
          config:
            - type: container
              paths: ["/var/lib/docker/containers/${data.docker.container.id}/*.log"]
processors:
  - add_docker_metadata: ~
setup.ilm.enabled: false
setup.template.name: "docker-logs"
setup.template.pattern: "docker-logs-*"
output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "docker-logs-%{+yyyy.MM.dd}"
